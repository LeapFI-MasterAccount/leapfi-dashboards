<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeapFI Platform · NorthWinds Credit Union (V2)</title>
    <!-- SH-10: pre-paint theme stamp. The static data-theme="dark" above is
         only the no-preference default; a stored preference must be stamped
         BEFORE first paint (App.tsx's post-mount effect is too late — a
         stored "light" would flash dark on every load). Key mirrors
         App.tsx's THEME_STORAGE_KEY; storage failures keep the shipped
         dark default. -->
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('nw-platform-v2-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (error) {
          /* storage unavailable — keep the shipped dark default */
        }
      })()
    </script>

terly AI risk summary remains on the Board Risk Committee calendar."]]},"ai-training":{t:"AI Acceptable Use Training Attestation",v:"2026 cycle",dom:"aigov",type:"Training",owner:"R. Fischer · CRO",status:"good",line:"96% completion · role-based modules · board module delivered",obl:[],secs:[["Contents","Completion records and signed attestations for the AI acceptable use curriculum, tracked by role. Lending and member service staff take the extended module covering disclosure and escalation duties."],["Coverage","Board members completed the governance briefing in May. Contractors with system access are enrolled through the vendor onboarding path."],["Open item","Eleven staff remain outstanding at cycle close. Managers were notified and completion is tracked to a September deadline."]]},"bcp-dr":{t:"Business Continuity & Disaster Recovery Plan",v:"v6.1",dom:"infosec",type:"Policy",owner:"P. Nguyen · ISD",status:"good",line:"Annual tabletop exercise complete · Mar 2026",obl:[],secs:[["1. Scope","Recovery objectives and procedures for core processing, digital banking, payments, and member contact channels, with dependencies mapped to the critical vendor set."],["2. Objectives","Recovery time and recovery point objectives are set per business process and tested against them, not asserted. Results feed the annual plan revision."],["3. Exercise results","The March tabletop covered core processor degradation and a ransomware containment scenario. Two process gaps were identified in member communication sequencing and both were closed in this version."]]},pentest:{t:"Annual Penetration Test & Remediation Tracker",v:"2026",dom:"infosec",type:"Evidence",owner:"P. Nguyen · ISD",status:"warn",line:"2 medium findings open · remediation due Sep 2026",obl:[],secs:[["Scope","External perimeter, digital banking application, internal network segmentation, and a social engineering component, performed by an independent firm in April."],["Results","No critical or high findings. Four m s:[["1. Requirement","Investigation and resolution of member-reported electronic transfer errors within the timeframes set by Regulation E, including provisional credit where the investigation extends."],["2. Intake","Errors are accepted through any channel the member uses, including automated channels, and are logged to the complaint record on receipt."],["3. Open item","Where an automated channel takes the first report, the clock start currently depends on staff transcription. That dependency is being removed."]],redline:{note:"Proposed revision to §2 · error clock start for automated intake channels · drafted by OnSide",old:"The investigation period begins when a representative logs the reported error to the complaint record.",nw:"The investigation period begins on the member&rsquo;s first report through any channel, including automated chat and messaging, timestamped at receipt by the channel itself. Automated intake creates the complaint record directly, and staff review confirms rather than starts the clock."}},"hmda-lar":{t:"HMDA LAR Data Integrity Review",v:"2026 submission",dom:"fairlend",type:"Evidence",owner:"M. Okafor · CCO",status:"good",line:"Pre-submission scrub complete · error rate within tolerance",obl:[],secs:[["Method","A sampled field-by-field review of the loan application register against source documents, run before submission and again after any resubmission."],["Results","The sampled error rate sits within the resubmission threshold. Corrections were concentrated in rate spread and action taken date, both traced to a single intake workflow that has been amended."],["Use","The register feeds the quarterly fair lending comparative review, so data integrity here is a precondition for the analysis there."]]},"cblr-worksheet":{t:"CBLR Calculation Worksheet & Sign-off",v:"Q2-2026",dom:"capital",type:"Evidence",owner:"CFO office",status:"good",line:"Independently reviewed · reconciles to the call report",obl:[],secs:[["Contents","The quarter-end l rivacy & Data Handling Policy §2 · GLBA"]}],Am={connect:{icon:"⇄",name:"LeapFI · Connect",tag:"The MCP and API layer of LeapFI · OnSide",phase:"Part of OnSide · in development",lead:"Every institution employs technical resources whose real job is translation: read the policy manual, decide what it requires, then configure each system by hand. Connect ends that. Any system, vendor platform, or agent reads the institution’s current policies from OnSide and configures itself against them, at install and at every policy change. Your Microsoft 365 tenant takes its retention labels, DLP rules, and sharing settings straight from the record. Nobody re-types anything, and the exam file shows configuration provably derived from approved policy.",steps:["Policy approved in OnSide","Connect writes it into your systems","Configuration evidence on file"],note:"Approved once, applied everywhere, evidenced automatically.",stats:[["5","SYSTEM CLASSES","productivity estate, cloud infrastructure, loan origination, HR and personnel, vendor and servicing platforms"],["2-way","MCP + REST","systems read policy and report their configuration back"],["Same day","APPROVAL TO CONFIG","a redline approved in OnSide propagates on approval"],["100%","CHANGES LOGGED","every push carries the policy version that produced it"]],close:"As more institutions expose their rules this way, one integration configures every client correctly, and building toward LeapFI becomes cheaper for a vendor than re-implementing policy client by client.",cmp:{today:[["Policy approved to systems updated",100,"2-6 weeks"],["Configuration matches policy",55,"spot checks"],["Evidence for the examiner",40,"by hand"]],after:[["Policy approved to systems updated",6,"same day"],["Configuration matches policy",100,"continuous"],["Evidence for the examiner",100,"generated"]]}},allrailz:{icon:"≋",name:"LeapFI · AllRailz",tag:"The agentic runtime",phase:"In development · deploys in weeks, zero core replacement",lead:"An agentic-nat
