    <!-- SH-10: pre-paint theme stamp. The static data-theme="dark" above is
         only the no-preference default; a stored preference must be stamped
         BEFORE first paint (App.tsx's post-mount effect is too late — a
         stored "light" would flash dark on every load). Key mirrors
         App.tsx's THEME_STORAGE_KEY; storage failures keep the shipped
         dark default. -->
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('nw-platform-v2-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (error) {
          /* storage unavailable — keep the shipped dark default */
        }
      })()
    </script>

Each system that informs a member-facing decision is assessed for fairness exposure: the outcome it influences, the attributes it uses, proxy risk in those attributes, measured disparity across protected classes, and what the institution does when a threshold is breached."],["Results","No disparity above threshold in the assessed set. Two systems carry watch items on proxy features, both under quarterly re-test. The underwriting-support model carries the tightest thresholds because its outcome is closest to a credit decision."],["Open item","Three systems entered the inventory this quarter and have not been assessed yet. Owners are assigned and the assessments are scheduled before the systems reach production."],["Use","The assessment is what the board and the exam file see. It feeds the Fair Lending register and the adverse-action reason-code work directly."]]},"hitl-standard":{t:"Human-in-the-Loop Decision Authority Standard",v:"v1.4",dom:"aigov",type:"Standard",owner:"R. Fischer · CRO",status:"good",line:"Checkpoints enforced by system tier · reviewed with the charter",obl:[],secs:[["Requirement","Where fairness or consumer-impact risk requires human decision authority, a named person decides. The system may recommend, rank, or draft. It may not be the final authority on the outcome."],["Where it applies","Every Tier 1 system: credit decisioning support, adverse-action reasoning, collections treatment, fraud dispositions that close a member account, and any automated member communication about fees, disputes, or account actions."],["Evidence","Each checkpoint logs who decided, when, on what information, and whether they departed from the recommendation. Override rates are reviewed quarterly, because an approval rate near 100% means the checkpoint is not doing work."]]},"ai-inventory":{t:"AI System Inventory & Use-Case Register",v:"Live register",dom:"aigov",type:"Evidence",owner:"R. Fischer · CRO",status:"good",line:"23 systems catalogued · tier and owner assigned to each",obl:[],secs:[["Contents","Every AI and automated decision system in operation, with business owner, purpose, member impact, data touched, vendor or in-house build, governance tier, and the date of the last review."],["Tiering","Tier 1 covers systems that inform member-facing decisions. Tier 2 covers systems that inform staff judgement. Tier 3 covers internal productivity use with no member impact. Depth of governance follows the tier."],["Reconciliation","The register reconciles monthly against the model inventory held by Model Risk, so a system cannot be governed as an AI use case and be missing from the model record."]]},"ai-committee":{t:"AI Governance Committee Minutes",v:"Jul 2026",dom:"aigov",type:"Committee record",owner:"R. Fischer · CRO",status:"good",line:"Monthly session · quorum met · CEO and CCO present",obl:[],secs:[["Agenda","Three new use cases presented for tier assignment. Review of the member-messaging disclosure draft. Status of the CRI control crosswalk. Watchlist update on S. 4127 and the interagency RFI."],["Decisions","Approved two use cases at Tier 2 and held one at Tier 1 pending a fair-lending impact review. Directed that the disclosure standard return with UDAAP sign-off before adoption."],["Escalation","Nothing rose to the Board this cycle. The standing quarterly AI risk summary remains on the Board Risk Committee calendar."]]},"ai-training":{t:"AI Acceptable Use Training Attestation",v:"2026 cycle",dom:"aigov",type:"Training",owner:"R. Fischer · CRO",status:"good",line:"96% completion · role-based modules · board module delivered",obl:[],secs:[["Contents","Completion records and signed attestations for the AI acceptable use curriculum, tracked by role. Lending and member service staff take the extended module covering disclosure and escalation duties."],["Coverage","Board members completed the governance briefing in May. Contractors with system access are enrolled through the vendor onboarding path."],["Open item","Eleven staff remain outstanding at cycle close. Managers were notified and completion is tracked to a September deadline."]]},"bcp-dr":{t:"Business Continuity & Disaster Recovery Plan",v:"v6.1",dom:"infosec",type:"Policy",owner:"P. Nguyen · ISD",status:"good",line:"Annual tabletop exercise complete · Mar 2026",obl:[],secs:[["1. Scope","Recovery objectives and procedures for core processing, digital banking, payments, and member contact channels, with dependencies mapped to the critical vendor set."],["2. Objectives","Recovery time and recovery point objectives are set per business process and tested against them, not asserted. Results feed the annual plan revision."],["3. Exercise results","The March tabletop covered core processor degradation and a ransomware containment scenario. Two process gaps were identified in member communication sequencing and both were closed in this version."]]},pentest:{t:"Annual Penetration Test & Remediation Tracker",v:"2026",dom:"infosec",type:"Evidence",owner:"P. Nguyen · ISD",status:"warn",line:"2 medium findings open · remediation due Sep 2026",obl:[],secs:[["Scope","External perimeter, digital banking application, internal network segmentation, and a social engineering component, performed by an independent firm in April."],["Results","No critical or high findings. Four medium findings, two of which are closed and verified. The two open items concern session handling in a secondary portal and a legacy service account scope."],["Tracking","Each finding carries an owner, a due date, and re-test evidence on closure. Aggregate status reports to the Board Risk Committee quarterly."]]},"sar-qa":{t:"SAR Quality Assurance Review",v:"Q2-2026",dom:"bsa",type:"Evidence",owner:"T. Whitfield · BSA Officer",status:"good",line:"Sampled review complete · timeliness within requirement",obl:[],secs:[["Method","A sample of filed suspicious activity reports is reviewed each quarter for narrative sufficiency, supporting documentation, decision rationale, and filing timeliness."],["Results","All sampled filings met the 30-day requirement. Narrative quality was rated adequate or better throughout, with coaching notes issued on two files for supporting detail."],["Linkage","Alert disposition quality feeds the transaction monitoring tuning record, which is where the model validation obligation picks it up."]]},"ofac-test":{t:"OFAC Screening Independent Test",v:"2026",dom:"bsa",type:"Evidence",owner:"T. Whitfield · BSA Officer",status:"warn",line:"Threshold tuning recommended · action plan agreed",obl:[],secs:[["Scope","Independent test of the sanctions screening configuration covering list currency, name matching logic, batch and real-time coverage, and alert disposition quality."],["Findings","List updates applied same day throughout the period. The test recommends tuning the fuzzy match threshold, which currently produces a false positive rate above peer benchmark and slows disposition."],["Action","Tuning is scheduled with the vendor for Q3, with a before and after effectiveness comparison retained as evidence. No missed matches were identified."]]},"rege-proc":{t:"Regulation E Error Resolution Procedure",v:"v3.2",dom:"consumer",type:"Procedure",owner:"M. Okafor · CCO",status:"warn",line:"Provisional credit timing under revision · see redline",obl:[],secs:[["1. Requirement","Investigation and resolution of member-reported electronic transfer errors within the timeframes set by Regulation E, including provisional credit where the investigation extends."],["2. Intake","Errors are accepted through any channel the member uses, including automated channels, and are logged to the complaint record on receipt."],["3. Open item","Where an automated channel takes the first report, the clock start currently depends on staff transcription. That dependency is being removed."]],redline:{note:"Proposed revision to §2 · error clock start for automated intake channels · drafted by OnSide",old:"The investigation period begins when a representative logs the reported error to the complaint record.",nw:"The investigation period begins on the member&rsquo;s first report through any channel, including automated chat and messaging, timestamped at receipt by the channel itself. Automated intake creates the complaint record directly, and staff review confirms rather than starts the clock."}},"hmda-lar":{t:"HMDA LAR Data Integrity Review",v:"2026 submission",dom:"fairlend",type:"Evidence",owner:"M. Okafor · CCO",status:"good",line:"Pre-submission scrub complete · error rate within tolerance",obl:[],secs:[["Method","A sampled field-by-field review of the loan application register against source documents, run before submission and again after any resubmission."],["Results","The sampled error rate sits within the resubmission threshold. Corrections were concentrated in rate spread and action taken date, both traced to a single intake workflow that has been amended."],["Use","The register feeds the quarterly fair lending comparative review, so data integrity here is a precondition for the analysis there."]]},"cblr-worksheet":{t:"CBLR Calculation Worksheet & Sign-off",v:"Q2-2026",dom:"capital",type:"Evidence",owner:"CFO office",status:"good",line:"Independently reviewed · reconciles to the call report",obl:[],secs:[["Contents","The quarter-end leverage ratio calculation with supporting balances, the qualifying criteria check, and the preparer and reviewer sign-off."],["Control","A second reviewer independent of the preparer reconciles the worksheet to the filed call report before sign-off. Variances above tolerance are documented with explanation."],["Position","The ratio sits well above the qualifying threshold, with prompt corrective action headroom reported in the capital narrative each quarter."]]},"mrm-policy":{t:"Model Risk Management Policy",v:"v3.1",dom:"mrm",type:"Policy",owner:"A. Kaur · Model Risk Manager",status:"good",line:"Approved by Board Risk Committee · Jul 14, 2026 · annual review Jul 2027",obl: ged so the charter update ships the day the interagency scope finalizes."]],redline:{note:"Proposed insertion into the Model Risk Management Policy §2 (Scope) · pending RFI 2026-04 outcome",old:"Scope excludes exploratory analytics tools not used in decisioning.",nw:"Scope includes generative and agentic AI systems whose outputs inform member-facing decisions or regulatory processes, subject to interim governance in Appendix D until interagency scope is finalized."}},"mrm-change-draft":{t:"Model Change Approval Workflow",v:"Draft 0.8",dom:"mrm",type:"Draft",owner:"A. Kaur · Model Risk Manager",status:"warn",line:"In HITL review queue · language drafted",obl:["MRM-09"],secs:[["Status","Formal approval gate for model changes before deployment: change classification, required approvals by tier, and rollback provisions."]],redline:{note:"Proposed insertion into the Model Risk Management Policy §3 (Governance) · closes MRM-09 · drafted by OnSide",old:"Model owners deploy changes to production models under existing change-management procedures.",nw:"No change to a tiered production model reaches production without classification by materiality, approval at the level its tier requires, a documented rollback position, and a record of the approval in the model inventory. Immaterial changes are logged and reviewed in aggregate at the next MRM Committee.",analystEdit:"No change to a tiered production model reaches production without classification by materiality, approval at the level its tier requires under the Model Tiering Matrix, a documented, tested rollback position, and a record of the approval in the model inventory. Immaterial changes are logged and reviewed in aggregate at the next scheduled MRM Committee meeting."}},"tprm-program":{t:"Third-Party Risk Management Program",v:"v2.0",dom:"tprm",type:"Policy",owner:"P. Nguyen · ISD",status:"warn",line:"Exit-planning section in draft · see redline",obl:["TPRM-01","TPRM-03","TPRM-05","TPRM-12"],secs:[["1. Purpose","Establi t Rider v3.0, rolling into the 9 legacy contracts that predate it, on schedule through Q1-2027.",deepLinks:[{label:"See TPRM-04 in Third-Party Risk",request:{screen:"onside.overview",kind:"obligation",id:"tprm:TPRM-04"}},{label:"Open the Contract Rider template",request:{screen:"onside.documents",kind:"document",id:"contract-rider"}}]},{id:"onside-aigov-open",question:"What's open in AI Governance?",responseText:"AI Governance carries the widest gap: 104 of 214 applicable CRI controls sit below required maturity across GOVERN, MAP, MEASURE, and MANAGE. The highest-priority open item is the Incident Response Plan's missing escalation path for member-facing automation — the one critical-severity gap on the board, owned by P. Nguyen, with the §3.4 redline already drafted and awaiting her review. The Governance Charter's generative and agentic scope language is pre-staged and ships the day RFI 2026-04 finalizes.",deepLinks:[{label:"Open AI Governance",request:{screen:"onside.overview",kind:"domain",id:"aigov"}},{label:"Read the Incident Response Plan redline",request:{screen:"onside.documents",kind:"document",id:"irp"}}]},{id:"onside-tprm-08",question:"What's the status of the TPRM-08 exit-plan gap?",responseText:"TPRM-08 requires documented termination and exit plans for critical relationships, including data portability — today exit is handled ad hoc at contract end. The Exit Plan Standard, Draft 0.7, is in HITL review, and it proposes a new §6 on the Third-Party Risk Management Program itself. That is Case CASE-2026-002, owned by P. Nguyen.",deepLinks:[{label:"See TPRM-08 in Third-Party Risk",request:{screen:"onside.overview",kind:"obligation",id:"tprm:TPRM-08"}},{label:"Open Case CASE-2026-002",request:{screen:"cases",kind:"case",id:"CASE-2026-002"}}]},{id:"onside-aa-reason-codes",question:"Where do adverse-action reason codes stand?",responseText:"Circular 2026-C1 requires specific principal reasons for model-assisted denials. The Adverse-Action Procedure's §4 redline is drafted: reason codes now derive from the model's documented feature attributions, mapped through a tested attribution-to-code matrix and verified quarterly against a sampled file review. That is Case CASE-2026-003, owned by M. Okafor.",deepLinks:[{label:"Open the Adverse-Action Procedure redline",request:{screen:"onside.documents",kind:"document",id:"aa-procedure"}},{label:"See Case CASE-2026-003",request:{screen:"cases",kind:"case",id:"CASE-2026-003"}}]},{id:"onside-reg-lifecycle",question:"How does a rule move from proposed to in force?",responseText:"Every item moves through three stages on one page: newly proposed, tracked while it is live — like RFI 2026-04, comments due September 30, or NM HB 210, passed the Senate 34–6 and awaiting the House — and in force once it is binding, like Interagency Guidance 2026-13, effective since April 17, 2026.",deepLinks:[{label:"See the regulatory lifecycle",request:{screen:"onside.feed",kind:"section",id:"lifecycle"}}]},{id:"onside-mrm-policy-owner",question:"Who owns the Model Risk Management Policy?",responseText:"The Model Risk Management Policy is CRO-accountable and Model Risk Manager-responsible, with General Counsel consulted and the Board and CCO informed. It is current — Board Risk Committee sign-off July 14, 2026, next review July 2027.",deepLinks:[{label:"Open the Model Risk Management Policy",request:{screen:"onside.documents",kind:"document",id:"mrm-policy"}}]},{id:"onside-aigov-attainment",question:"What's our compliance-attainment standing in AI Governance?",responseText:"AI Governance stands at 110 of 214 applicable CRI FS AI RMF controls at the required maturity band — target 3 for the current use-case set, stepping to 4 once agentic workflows reach production. NCUA and the interagency framework are the governing authority (CRI FS AI RMF, the 230-control flagship framework, cross-checked against the NIST AI RMF catalog). R. Fischer, CRO, owns the program.",deepLinks:[{label:"Open AI Governance",request:{screen:"onside.overview",kind:"domain",id:"aigov"}}],response:{responseType:"compliance-attainment",domainKey:"aigov"}}]},Ax={entries:[{id:"studio-blocker-underwriting-assist",question:"What's blocking Underwriting assist?",responseText:"Underwriting assist is sequence-gated on Adverse Action, the weakest of its three governance gates at 55% against the 80% bar — Fair Lending sits at 68%, Model Risk at 70%. It also depends on two other plays landing first: Unified data foundation and AI adverse-action letter drafting. At $150,000 to build against $400,000 in annual value, it's the largest single opportunity in the portfolio, and Adverse Action is what's holding it back.",deepLinks:[{label:"Open Underwriting assist in Investment Design",request:{screen:"studio.investment-design",kind:"play",id:"Underwriting assist"}}],response:{responseType:"opportunity-status",opportunityId:"Underwriting assist"}},{id:"studio-blocker-txn-monitoring-tuning",question:"What's blocking Transaction-monitoring tuning assist?",responseText:"Transaction-monitoring tuning assist is gated on Model Risk, at 70% against the 80% bar — BSA/AML is already ahead at 74%. It also waits on Unified data foundation, the shared data layer every strategic play draws on. Once both clear, it is a $120,000 build against $330,000 a year.",deepLinks:[{label:"Open Transaction-monitoring tuning assist",request:{screen:"studio.investment-design",kind:"play",id:"Transaction-monitoring tuning assist"}}],response:{responseType:"opportunity-status",opportunityId:"Transaction-monitoring tuning assist"}},{id:"studio-blocker-fraud-model-refresh",question:"What's blocking Fraud model refresh?",responseText:"Fraud model refresh has one gate: Model Risk, at 70% against the 80% bar. It is also sequenced behind Unified data foundation. At $90,000 to build against $260,000 a year, it clears as soon as Model Risk closes.",deepLinks:[{label:"Open Fraud model refresh",request:{screen:"studio.investment-design",kind:"play",id:"Fraud model refresh"}}],response:{responseType:"opportunity-status",opportunityId:"Fraud model refresh"}},{id:"studio-blocker-deposit-pricing",question:"What's blocking Deposit pricing optimization?",responseText:"Deposit pricing optimization is gated the same way as the other Model Risk-dependent plays: 70% against the 80% bar, and sequenced behind Unified data foundation. Build is $80,000 against $240,000 a year once it clears.",deepLinks:[{label:"Open Deposit pricing optimization",request:{screen:"studio.investment-design",kind:"play",id:"Deposit pricing optimization"}}],response:{responseType:"opportunity-status",opportunityId:"Deposit pricing optimization"}},{id:"studio-unified-data-foundation",question:"Why does everything wait on Unified data foundation?",responseText:"Unified data foundation is the one dependency the strategic plays share: the governed warehouse, conformed core, and feature layer everything else draws on. Six plays wait on it — Transaction-monitoring tuning assist, Fraud model refresh, Marketing personalization, Deposit pricing optimization, Underwriting assist, and Complaint analytics. It is a $250,000 build gated on InfoSec, already at 90% against the 80% bar.",deepLinks:[{label:"Open Unified data foundation",request:{screen:"studio.investment-design",kind:"play",id:"Unified data foundation"}}],response:{responseType:"opportunity-status",opportunityId:"Unified data foundation"}},{id:"studio-biggest-opportunity",question:"What's the biggest opportunity in the portfolio?",responseText:"By annual value, Underwriting assist tops the catalog at $400,000 a year against a $150,000 build — the single largest opportunity, gated on Adverse Action governance maturity before it enters the funded portfolio.",deepLinks:[{label:"Open Underwriting assist in Investment Design",request:{screen:"studio.investment-design",kind:"play",id:"Underwriting assist"}}],response:{responseType:"opportunity-status",opportunityId:"Underwriting assist"}},{id:"studio-doc-adverse-action-redline",question:"What document closes the Adverse Action gate blocking Underwriting assist?",responseText:"Underwriting assist's weakest gate is Adverse Action, at 55% against the 80% bar. The fix is already drafted: the Adverse-Action Procedure's §4 redline derives reason codes from the model's documented feature attributions, mapped through a tested attribution-to-code matrix and verified quarterly against a sampled file review. It's moving through Case CASE-2026-003, owned by M. Okafor.",deepLinks:[{label:"Open the Adverse-Action Procedure redline",request:{screen:"onside.documents",kind:"document",id:"aa-procedure"}},{label:"See Case CASE-2026-003",request:{screen:"cases",kind:"case",id:"CASE-2026-003"}}],response:{responseType:"document"}},{id:"studio-howto-unblock-play",question:"How does a play get unblocked?",responseText:"Two things hold a play back. First, a governance gate below the 80% control-maturity bar — a play's weakest listed gate has to clear 80 before the play is ready. Second, any dependency play in its own list that hasn't landed yet. Unified data foundation is the one dependency six plays share — Transaction-monitoring tuning assist, Fraud model refresh, Marketing personalization, Deposit pricing optimization, Underwriting assist, and Complaint analytics — so it lands first in the funded sequence almost by construction.",deepLinks:[{label:"Open Unified data foundation",request:{screen:"studio.investment-design",kind:"play",id:"Unified data foundation"}}],response:{responseType:"instructional"}},{id:"studio-fairlend-attainment",question:"Is Fair Lending compliance ready to support Underwriting assist?",responseText:"Fair Lending governs two of Underwriting assist's three gates — Fair Lending itself, at 68% control maturity, and Adverse Action, its weakest gate at 55% — both against the 80% bar the play needs to clear. On the compliance side, the same domain (Fair Lending · ECOA / Reg B, CFPB and NCUA authority, Circular 2026-C1's adverse-action specificity) stands at 21 of 29 applicable obligations met — two short of the Managed target, which was raised to 4 because Underwriting assist and adverse-action drafting trigger disparate-impact testing and model-derived reason-code obligations.",deepLinks:[{label:"Open Fair Lending in OnSide",request:{screen:"onside.overview",kind:"domain",id:"fairlend"}}],response:{responseType:"compliance-attainment",domainKey:"fairlend"}}]},kt={module:"onside",drawerTitle:"OnSide chat",entryLabel:"Ask OnSide",inputLabel:"Ask OnSide a question",inputPlaceholder:"Ask about a regulatory item, obligation, or document…",greeting:"Ask me about anything in your regulatory feed, obligations, or documents.",defaultNoMatchMessage:"No matching OnSide answer for that yet.",entries:Cx.entries},Ut={module:"studio",drawerTitle:"Studio chat",entryLabel:"Ask Studio",inputLabel:"Ask Studio a question",inputPlaceholder:"Ask about an opportunity, play, or what is blocking it…",greeting:"Ask me about an opportunity, play, or what's blocking it.",defaultNoMatchMessage:"No matching Studio answer for that yet.",entries:Ax.entries};function gt(e){return e.replace(/&amp;/g,"&")}const Px=/^<span[^>]*>([^<]*)<\/span>\s*/i;function Mx(e){const t=Px.exec(e);return t?{badge:(t[1]??"")||null,text:e.slice(t[0].length).trim()}:{badge:null,text:e}}const Ex=new Map(Wd.map(([e,t])=>[e,gt(t)])),Ox=new Map(Jr.map(e=>[gt(e.n),e])),Ma=(()=>{const e=[];for(const[t,n]of Object.entries(Aa)){const i=gt(t),o=Ox.get(i),a=(o==null?void 0:o.l)??"Unknown";n.items.forEach((s,l)=>{const[d,u,p,c,f,y]=s,{badge:x,text:q}=Mx(c);e.push({id:`${i}::${l}`,source:i,layer:a,daysAgo:d,date:u,title:gt(p),badge:x,note:gt(q),action:f,...y!==void 0?{description:gt(y)}:{}})})}return e})(),Ix=(()=>{const e=new Map;for(const t of Ma)e.set(t.source,(e.get(t.source)??0)+1);return Jr.map(t=>{const n=gt(t.n);return{id:n,label:n,count:e.get(n)??0}})})(),Dx=new Map(Ma.map(e=>[e.id,e])),Lx={flex:"1 1 auto",minWidth:0,overflowY:"auto",
