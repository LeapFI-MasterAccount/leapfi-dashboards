    <!-- SH-10: pre-paint theme stamp. The static data-theme="dark" above is
         only the no-preference default; a stored preference must be stamped
         BEFORE first paint (App.tsx's post-mount effect is too late — a
         stored "light" would flash dark on every load). Key mirrors
         App.tsx's THEME_STORAGE_KEY; storage failures keep the shipped
         dark default. -->
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('nw-platform-v2-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (error) {
          /* storage unavailable — keep the shipped dark default */
        }
      })()
    </script>

,["Results","No disparity above threshold in the assessed set. Two systems carry watch items on proxy features, both under quarterly re-test. The underwriting-support model carries the tightest thresholds because its outcome is closest to a credit decision."],["Open item","Three systems entered the inventory this quarter and have not been assessed yet. Owners are assigned and the assessments are scheduled before the systems reach production."],["Use","The assessment is what the board and the exam file see. It feeds the Fair Lending register and the adverse-action reason-code work directly."]]},"hitl-standard":{t:"Human-in-the-Loop Decision Authority Standard",v:"v1.4",dom:"aigov",type:"Standard",owner:"R. Fischer · CRO",status:"good",line:"Checkpoints enforced by system tier · reviewed with the charter",obl:[],secs:[["Requirement","Where fairness or consumer-impact risk requires human decision authority, a named person decides. The system may recommend, rank, or draft. It may not be the final authority on the outcome."],["Where it applies","Every Tier 1 system: credit decisioning support, adverse-action reasoning, collections treatment, fraud dispositions that close a member account, and any automated member communication about fees, disputes, or account actions."],["Evidence","Each checkpoint logs who decided, when, on what information, and whether they departed from the recommendation. Override rates are reviewed quarterly, because an approval rate near 100% means the checkpoint is not doing work."]]},"ai-inventory":{t:"AI System Inventory & Use-Case Register",v:"Live register",dom:"aigov",type:"Evidence",owner:"R. Fischer · CRO",status:"good",line:"23 systems catalogued · tier and owner assigned to each",obl:[],secs:[["Contents","Every AI and automated decision system in operation, with business owner, purpose, member impact, data touched, vendor or in-house build, governance tier, and the date of the last review."],["Tiering","Tier 1 covers systems that inform member-facing decisions. Tier 2 covers systems that inform staff judgement. Tier 3 covers internal productivity use with no member impact. Depth of governance follows the tier."],["Reconciliation","The register reconciles monthly against the model inventory held by Model Risk, so a system cannot be governed as an AI use case and be missing from the model record."]]},"ai-committee":{t:"AI Governance Committee Minutes",v:"Jul 2026",dom:"aigov",type:"Committee record",owner:"R. Fischer · CRO",status:"good",line:"Monthly session · quorum met · CEO and CCO present",obl:[],secs:[["Agenda","Three new use cases presented for tier assignment. Review of the member-messaging disclosure draft. Status of the CRI control crosswalk. Watchlist update on S. 4127 and the interagency RFI."],["Decisions","Approved two use cases at Tier 2 and held one at Tier 1 pending a fair-lending impact review. Directed that the disclosure standard return with UDAAP sign-off before adoption."],["Escalation","Nothing rose to the Board this cycle. The standing quarterly AI risk summary remains on the Board Risk Committee calendar."]]},"ai-training":{t:"AI Acceptable Use Training Attestation",v:"2026 cycle",dom:"aigov",type:"Training",owner:"R. Fischer · CRO",status:"good",line:"96% completion · role-based modules · board module delivered",obl:[],secs:[["Contents","Completion records and signed attestations for the AI acceptable use curriculum, tracked by role. Lending and member service staff take the extended module covering disclosure and escalation duties."],["Coverage","Board members completed the governance briefing in May. Contractors with system access are enrolled through the vendor onboarding path."],["Open item","Eleven staff remain outstanding at cycle close. Managers were notified and completion is tracked to a September deadline."]]},"bcp-dr":{t:"Business Continuity & Disaster Recovery Plan",v:"v6.1",dom:"infosec",type:"Policy",owner:"P. Nguyen · ISD",status:"good",line:"Annual tabletop exercise complete · Mar 2026",obl:[],secs:[["1. Scope","Recovery objectives and procedures for core processing, digital banking, payments, and member contact channels, with dependencies mapped to the critical vendor set."],["2. Objectives","Recovery time and recovery point objectives are set per business process and tested against them, not asserted. Results feed the annual plan revision."],["3. Exercise results","The March tabletop covered core processor degradation and a ransomware containment scenario. Two process gaps were identified in member communication sequencing and both were closed in this version."]]},pentest:{t:"Annual Penetration Test & Remediation Tracker",v:"2026",dom:"infosec",type:"Evidence",owner:"P. Nguyen · ISD",status:"warn",line:"2 medium findings open · remediation due Sep 2026",obl:[],secs:[["Scope","External perimeter, digital banking application, internal network segmentation, and a social engineering component, performed by an independent firm in April."],["Results","No critical or high findings. Four medium findings, two of which are closed and verified. The two open items concern session handling in a secondary portal and a legacy service account scope."],["Tracking","Each finding carries an owner, a due date, and re-test evidence on closure. Aggregate status reports to the Board Risk Committee quarterly."]]},"sar-qa":{t:"SAR Quality Assurance Review",v:"Q2-2026",dom:"bsa",type:"Evidence",owner:"T. Whitfield · BSA Officer",status:"good",line:"Sampled review complete · timeliness within requirement",obl:[],secs:[["Method","A sample of filed suspicious activity reports is reviewed each quarter for narrative sufficiency, supporting documentation, decision rationale, and filing timeliness."],["Results","All sampled filings met the 30-day requirement. Narrative quality was rated adequate or better throughout, with coaching notes issued on two files for supporting detail."],["Linkage","Alert disposition quality feeds the transaction monitoring tuning record, which is where the model validation obligation picks it up."]]},"ofac-test":{t:"OFAC Screening Independent Test",v:"2026",dom:"bsa",type:"Evidence",owner:"T. Whitfield · BSA Officer",status:"warn",line:"Threshold tuning recommended · action plan agreed",obl:[],secs:[["Scope","Independent test of the sanctions screening configuration covering list currency, name matching logic, batch and real-time coverage, and alert disposition quality."],["Findings","List updates applied same day throughout the period. The test recommends tuning the fuzzy match threshold, which currently produces a false positive rate above peer benchmark and slows disposition."],["Action","Tuning is scheduled with the vendor for Q3, with a before and after effectiveness comparison retained as evidence. No missed matches were identified."]]},"rege-proc":{t:"Regulation E Error Resolution Procedure",v:"v3.2",dom:"consumer",type:"Procedure",owner:"M. Okafor · CCO",status:"warn",line:"Provisional credit timing under revision · see redline",obl:[],secs:[["1. Requirement","Investigation and resolution of member-reported electronic transfer errors within the timeframes set by Regulation E, including provisional credit where the investigation extends."],["2. Intake","Errors are accepted through any channel the member uses, including automated channels, and are logged to the complaint record on receipt."],["3. Open item","Where an automated channel takes the first report, the clock start currently depends on staff transcription. That dependency is being removed."]],redline:{note:"Proposed revision to §2 · error clock start for automated intake channels · drafted by OnSide",old:"The investigation period begins when a representative logs the reported error to the complaint record.",nw:"The investigation period begins on the member&rsquo;s first report through any channel, including automated chat and messaging, timestamped at receipt by the channel itself. Automated intake creates the complaint record directly, and staff review confirms rather than starts the clock."}},"hmda-lar":{t:"HMDA LAR Data Integrity Review",v:"2026 submission",dom:"fairlend",type:"Evidence",owner:"M. Okafor · CCO",status:"good",line:"Pre-submission scrub complete · error rate within tolerance",obl:[],secs:[["Method","A sampled field-by-field review of the loan application register against source documents, run before submission and again after any resubmission."],["Results","The sampled error rate sits within the resubmission threshold. Corrections were concentrated in rate spread and action taken date, both traced to a single intake workflow that has been amended."],["Use","The register feeds the quarterly fair lending comparative review, so data integrity here is a precondition for the analysis there."]]},"cblr-worksheet":{t:"CBLR Calculation Worksheet & Sign-off",v:"Q2-2026",dom:"capital",type:"Evidence",owner:"CFO office",status:"good",line:"Independently reviewed · reconciles to the call report",obl:[],secs:[["Contents","The quarter-end leverage ratio calculation with supporting balances, the qualifying criteria check, and the preparer and reviewer sign-off."],["Control","A second reviewer independent of the preparer reconciles the worksheet to the filed call report before sign-off. Variances above tolerance are documented with explanation."],["Position","The ratio sits well above the qualifying threshold, with prompt corrective action headroom reported in the capital narrative each quarter."]]},"mrm-policy":{t:"Model Risk Management Policy",v:"v3.1",dom:"mrm",type:"Policy",owner:"A. Kaur · Model Risk Manager",status:"good",line:"Approved by Board Risk Committee · Jul 14, 2026 · annual review Jul 2027",obl:["MRM-01","MRM-03","MRM-12"],secs:[["1. Purpose","Establishes the framework for identifying, measuring, monitoring, and controlling model risk across the Credit Union, aligned to Interagency Guidance 2026-13."],["2. Scope","Applies to all models as defined in §II of 2026-13
