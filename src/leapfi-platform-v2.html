    <!-- SH-10: pre-paint theme stamp. The static data-theme="dark" above is
         only the no-preference default; a stored preference must be stamped
         BEFORE first paint (App.tsx's post-mount effect is too late — a
         stored "light" would flash dark on every load). Key mirrors
         App.tsx's THEME_STORAGE_KEY; storage failures keep the shipped
         dark default. -->
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('nw-platform-v2-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (error) {
          /* storage unavailable — keep the shipped dark default */
        }
      })()
    </script>

nagement Program §4","Privacy & Data Handling Policy §2 · GLBA"]}],Km={connect:{icon:"⇄",name:"LeapFI · Connect",tag:"The MCP and API layer of LeapFI · OnSide",phase:"Part of OnSide · in development",lead:"Every institution employs technical resources whose real job is translation: read the policy manual, decide what it requires, then configure each system by hand. Connect ends that. Any system, vendor platform, or agent reads the institution’s current policies from OnSide and configures itself against them, at install and at every policy change. Your Microsoft 365 tenant takes its retention labels, DLP rules, and sharing settings straight from the record. Nobody re-types anything, and the exam file shows configuration provably derived from approved policy.",steps:["Policy approved in OnSide","Connect writes it into your systems","Configuration evidence on file"],note:"Approved once, applied everywhere, evidenced automatically.",stats:[["5","SYSTEM CLASSES","productivity estate, cloud infrastructure, loan origination, HR and personnel, vendor and servicing platforms"],["2-way","MCP + REST","systems read policy and report their configuration back"],["Same day","APPROVAL TO CONFIG","a redline approved in OnSide propagates on approval"],["100%","CHANGES LOGGED","every push carries the policy version that produced it"]],close:"As more institutions expose their rules this way, one integration configures every client correctly, and building toward LeapFI becomes cheaper for a vendor than re-implementing policy client by client.",cmp:{today:[["Policy approved to systems updated",100,"2-6 weeks"],["Configuration matches policy",55,"spot checks"],["Evidence for the examiner",40,"by hand"]],after:[["Policy approved to systems updated",6,"same day"],["Configuration matches policy",100,"continuous"],["Evidence for the examiner",100,"generated"]]}},allrailz:{icon:"≋",name:"LeapFI · AllRailz",tag:"The agentic runtime",phase:"In development · deploys in weeks, zero core replacemen type:"Evidence",owner:"R. Fischer · CRO",status:"warn",line:"8 of 11 member-facing systems assessed · 3 scheduled for Q3",obl:[],secs:[["Method","Each system that informs a member-facing decision is assessed for fairness exposure: the outcome it influences, the attributes it uses, proxy risk in those attributes, measured disparity across protected classes, and what the institution does when a threshold is breached."],["Results","No disparity above threshold in the assessed set. Two systems carry watch items on proxy features, both under quarterly re-test. The underwriting-support model carries the tightest thresholds because its outcome is closest to a credit decision."],["Open item","Three systems entered the inventory this quarter and have not been assessed yet. Owners are assigned and the assessments are scheduled before the systems reach production."],["Use","The assessment is what the board and the exam file see. It feeds the Fair Lending register and the adverse-action reason-code work directly."]]},"hitl-standard":{t:"Human-in-the-Loop Decision Authority Standard",v:"v1.4",dom:"aigov",type:"Standard",owner:"R. Fischer · CRO",status:"good",line:"Checkpoints enforced by system tier · reviewed with the charter",obl:[],secs:[["Requirement","Where fairness or consumer-impact risk requires human decision authority, a named person decides. The system may recommend, rank, or draft. It may not be the final authority on the outcome."],["Where it applies","Every Tier 1 system: credit decisioning support, adverse-action reasoning, collections treatment, fraud dispositions that close a member account, and any automated member communication about fees, disputes, or account actions."],["Evidence","Each checkpoint logs who decided, when, on what information, and whether they departed from the recommendation. Override rates are reviewed quarterly, because an approval rate near 100% means the checkpoint is not doing work."]]},"ai-inventory":{t:"AI System Inventory & Use-Case Register",v:"Live register",dom:"aigov",type:"Evidence",owner:"R. Fischer · CRO",status:"good",line:"23 systems catalogued · tier and owner assigned to each",obl:[],secs:[["Contents","Every AI and automated decision system in operation, with business owner, purpose, member impact, data touched, vendor or in-house build, governance tier, and the date of the last review."],["Tiering","Tier 1 covers systems that inform member-facing decisions. Tier 2 covers systems that inform staff judgement. Tier 3 covers internal productivity use with no member impact. Depth of governance follows the tier."],["Reconciliation","The register reconciles monthly against the model inventory held by Model Risk, so a system cannot be governed as an AI use case and be missing from the model record."]]},"ai-committee":{t:"AI Governance Committee Minutes",v:"Jul 2026",dom:"aigov",type:"Committee record",owner:"R. Fischer · CRO",status:"good",line:"Monthly session · quorum met · CEO and CCO present",obl:[],secs:[["Agenda","Three new use cases presented for tier assignment. Review of the member-messaging disclosure draft. Status of the CRI control crosswalk. Watchlist update on S. 4127 and the interagency RFI."],["Decisions","Approved two use cases at Tier 2 and held one at Tier 1 pending a fair-lending impact review. Directed that the disclosure standard return with UDAAP sign-off before adoption."],["Escalation","Nothing rose to the Board this cycle. The standing quarterly AI risk summary remains on the Board Risk Committee calendar."]]},"ai-training":{t:"AI Acceptable Use Training Attestation",v:"2026 cycle",dom:"aigov",type:"Training",owner:"R. Fischer · CRO",status:"good",line:"96% completion · role-based modules · board module delivered",obl:[],secs:[["Contents","Completion records and signed attestations for the AI acceptable use curriculum, tracked by role. Lending and member service staff take the extended module covering disclosure and escalation duties."],["Coverage","Board members co to third-party vendors — relevant because of our indirect-lending vendor relationships. TPRM-01, the complete vendor inventory, is already met. TPRM-04, the contract clauses covering audit rights, incident notification, and vendor disclosure, is partial: the disclosure language is drafted into Contract Rider v3.0, rolling into the 9 legacy contracts that predate it, on schedule through Q1-2027.",deepLinks:[{label:"See TPRM-04 in Third-Party Risk",request:{screen:"onside.overview",kind:"obligation",id:"tprm:TPRM-04"}},{label:"Open the Contract Rider template",request:{screen:"onside.documents",kind:"document",id:"contract-rider"}}]},{id:"onside-aigov-open",question:"What's open in AI Governance?",responseText:"AI Governance carries the widest gap: 104 of 214 applicable CRI controls sit below required maturity across GOVERN, MAP, MEASURE, and MANAGE. The highest-priority open item is the Incident Response Plan's missing escalation path for member-facing automation — the one critical-severity gap on the board, owned by P. Nguyen, with the §3.4 redline already drafted and awaiting her review. The Governance Charter's generative and agentic scope language is pre-staged and ships the day RFI 2026-04 finalizes.",deepLinks:[{label:"Open AI Governance",request:{screen:"onside.overview",kind:"domain",id:"aigov"}},{label:"Read the Incident Response Plan redline",request:{screen:"onside.documents",kind:"document",id:"irp"}}]},{id:"onside-tprm-08",question:"What's the status of the TPRM-08 exit-plan gap?",responseText:"TPRM-08 requires documented termination and exit plans for critical relationships, including data portability — today exit is handled ad hoc at contract end. The Exit Plan Standard, Draft 0.7, is in HITL review, and it proposes a new §6 on the Third-Party Risk Management Program itself. That is Case CASE-2026-002, owned by P. Nguyen.",deepLinks:[{label:"See TPRM-08 in Third-Party Risk",request:{screen:"onside.overview",kind:"obligation",id:"tprm:TPRM-08"}},{label:"Open Case CASE-2026-002",request:{screen:"cases",kind:"case",id:"CASE-2026-002"}}]},{id:"onside-aa-reason-codes",question:"Where do adverse-action reason codes stand?",responseText:"Circular 2026-C1 requires specific principal reasons for model-assisted denials. The Adverse-Action Procedure's §4 redline is drafted: reason codes now derive from the model's documented feature attributions, mapped through a tested attribution-to-code matrix and verified quarterly against a sampled file review. That is Case CASE-2026-003, owned by M. Okafor.",deepLinks:[{label:"Open the Adverse-Action Procedure redline",request:{screen:"onside.documents",kind:"document",id:"aa-procedure"}},{label:"See Case CASE-2026-003",request:{screen:"cases",kind:"case",id:"CASE-2026-003"}}]},{id:"onside-reg-lifecycle",question:"How does a rule move from proposed to in force?",responseText:"Every item moves through three stages on one page: newly proposed, tracked while it is live — like RFI 2026-04, comments due September 30, or NM HB 210, passed the Senate 34–6 and awaiting the House — and in force once it is binding, like Interagency Guidance 2026-13, effective since April 17, 2026.",deepLinks:[{label:"See the regulatory lifecycle",request:{screen:"onside.feed",kind:"section",id:"lifecycle"}}]},{id:"onside-mrm-policy-owner",question:"Who owns the Model Risk Management Policy?",responseText:"The Model Risk Management Policy is CRO-accountable and Model Risk Manager-responsible, with General Counsel consulted and the Board and CCO informed. It is current — Board Risk Committee sign-off July 14, 2026, next review July 2027.",deepLinks:[{label:"Open the Model Risk Management Policy",request:{screen:"onside.documents",kind:"document",id:"mrm-policy"}}]},{id:"onside-aigov-attainment",question:"What's our compliance-attainment standing in AI Governance?",responseText:"AI Governance stands at 110 of 214 applicable CRI FS AI RMF controls at the required maturity band — target 3 for the current use-case set, stepping to 4 once agentic workflows reach production. NCUA and the interagency framework are the governing authority (CRI FS AI RMF, the 230-control flagship framework, cross-checked against the NIST AI RMF catalog). R. Fischer, CRO, owns the program.",deepLinks:[{label:"Open AI Governance",request:{screen:"onside.overview",kind:"domain",id:"aigov"}}],response:{responseType:"compliance-attainment",domainKey:"aigov"}}]},cx={entries:[{id:"studio-blocker-underwriting-assist",question:"What's blocking Underwriting assist?",responseText:"Underwriting assist is sequence-gated on Adverse Action, the weakest of its three governance gates at 55% against the 80% bar — Fair Lending sits at 68%, Model Risk at 70%. It also depends on two other plays landing first: Unified data foundation and AI adverse-action letter drafting. At $150,000 to build against $400,000 in annual value, it's the largest single opportunity in the portfolio, and Adverse Action is what's holding it back.",deepLinks:[{label:"Open Underwriting assist in Investment Design",request:{screen:"studio.investment-design",kind:"play",id:"Underwriting assist"}}],response:{responseType:"opportunity-status",opportunityId:"Underwriting assist"}},{id:"studio-blocker-txn-monitoring-tuning",question:"What's blocking Transaction-monitoring tuning assist?",responseText:"Transaction-monitoring tuning assist is gated on Model Risk, at 70% against the 80% bar — BSA/AML is already ahead at 74%. It also waits on Unified data foundation, the shared data layer every strategic play draws on. Once both clear, it is a $120,000 build against $330,000 a year.",deepLinks:[{label:"Open Transaction-monitoring tuning assist",request:{screen:"studio.investment-design",kind:"play",id:"Transaction-monitoring tuning assist"}}],response:{responseType:"opportunity-status",opportunityId:"Transaction-monitoring tuning assist"}},{id:"studio-blocker-fraud-model-refresh",question:"What's blocking Fraud model refresh?",responseText:"Fraud model refresh has one gate: Model Risk, at 70% against the 80% bar. It is also sequenced behind Unified data foundation. At $90,000 to build against $260,000 a year, it clears as soon as Model Risk closes.",deepLinks:[{label:"Open Fraud model refresh",request:{screen:"studio.investment-design",kind:"play",id:"Fraud model refresh"}}],response:{responseType:"opportunity-status",opportunityId:"Fraud model refresh"}},{id:"studio-blocker-deposit-pricing",question:"What's blocking Deposit pricing optimization?",responseText:"Deposit pricing optimization is gated the same way as the other Model Risk-dependent plays: 70% against the 80% bar, and sequenced behind Unified data foundation. Build is $80,000 against $240,000 a year once it clears.",deepLinks:[{label:"Open Deposit pricing optimization",request:{screen:"studio.investment-design",kind:"play",id:"Deposit pricing optimization"}}],response:{responseType:"opportunity-status",opportunityId:"Deposit pricing optimization"}},{id:"studio-unified-data-foundation",question:"Why does everything wait on Unified data foundation?",responseText:"Unified data foundation is the one dependency the strategic plays share: the governed warehouse, conformed core, and feature layer everything else draws on. Six plays wait on it — Transaction-monitoring tuning assist, Fraud model refresh, Marketing personalization, Deposit pricing optimization, Underwriting assist, and Complaint analytics. It is a $250,000 build gated on InfoSec, already at 90% against the 80% bar.",deepLinks:[{label:"Open Unified data foundation",request:{screen:"studio.investment-design",kind:"play",id:"Unified data foundation"}}],response:{responseType:"opportunity-status",opportunityId:"Unified data foundation"}},{id:"studio-biggest-opportunity",question:"What's the biggest opportunity in the portfolio?",responseText:"By annual value, Underwriting assist tops the catalog at $400,000 a year against a $150,000 build — the single largest opportunity, gated on Adverse Action governance maturity before it enters the funded portfolio.",deepLinks:[{label:"Open Underwriting assist in Investment Design",request:{screen:"studio.investment-design",kind:"play",id:"Underwriting assist"}}],response:{responseType:"opportunity-status",opportunityId:"Underwriting assist"}},{id:"studio-doc-adverse-action-redline",question:"What document closes the Adverse Action gate blocking Underwriting assist?",responseText:"Underwriting assist's weakest gate is Adverse Action, at 55% against the 80% bar. The fix is already drafted: the Adverse-Action Procedure's §4 redline derives reason codes from the model's documented feature attributions, mapped through a tested attribution-to-code matrix and verified quarterly against a sampled file review. It's moving through Case CASE-2026-003, owned by M. Okafor.",deepLinks:[{label:"Open the Adverse-Action Procedure redline",request:{screen:"onside.documents",kind:"document",id:"aa-procedure"}},{label:"See Case CASE-2026-003",request:{screen:"cases",kind:"case",id:"CASE-2026-003"}}],response:{responseType:"document"}},{id:"studio-howto-unblock-play",question:"How does a play get unblocked?",responseText:"Two things hold a play back. First, a governance gate below the 80% control-maturity bar — a play's weakest listed gate has to clear 80 before the play is ready. Second, any dependency play in its own list that hasn't landed yet. Unified data foundation is the one dependency six plays share — Transaction-monitoring tuning assist, Fraud model refresh, Marketing personalization, Deposit pricing optimization, Underwriting assist, and Complaint analytics — so it lands first in the funded sequence almost by construction.",deepLinks:[{label:"Open Unified data foundation",request:{screen:"studio.investment-design",kind:"play",id:"Unified data foundation"}}],response:{responseType:"instructional"}},{id:"studio-fairlend-attainment",question:"Is Fair Lending compliance ready to support Underwriting assist?",responseText:"Fair Lending go
